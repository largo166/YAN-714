<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROM-AI 启动</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#060608; }
#cvs { position:fixed; inset:0; }
</style>
</head>
<body>
<canvas id="cvs"></canvas>
<script>
const canvas = document.getElementById('cvs');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, DPR;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = canvas.width = window.innerWidth * DPR;
  H = canvas.height = window.innerHeight * DPR;
  canvas.style.width = window.innerWidth + 'px';
  canvas.style.height = window.innerHeight + 'px';
  cx = W/2; cy = H/2;
}
resize();
window.addEventListener('resize', resize);

const rand = (a,b) => a + Math.random()*(b-a);
const lerp = (a,b,t) => a + (b-a)*t;

const C_GOLD = [201, 169, 110];
const C_GOLD_BRIGHT = [232, 213, 162];
const C_BLUE = [90, 159, 212];
const C_BLUE_BRIGHT = [126, 200, 232];
const C_WHITE = [232, 230, 225];

/* ============ 星尘粒子 ============ */
class StarDust {
  constructor() {
    this.x = rand(0, W);
    this.y = rand(0, H);
    this.size = rand(0.3, 2);
    this.baseAlpha = rand(0.05, 0.4);
    this.alpha = this.baseAlpha;
    this.phase = rand(0, Math.PI*2);
    this.speed = rand(0.005, 0.025);
    this.driftX = rand(-0.12, 0.12);
    this.driftY = rand(-0.12, 0.12);
  }
  update(t) {
    this.phase += this.speed;
    this.alpha = this.baseAlpha + Math.sin(this.phase)*0.2;
    this.x += this.driftX;
    this.y += this.driftY;
    if (this.x < -10) this.x = W+10;
    if (this.x > W+10) this.x = -10;
    if (this.y < -10) this.y = H+10;
    if (this.y > H+10) this.y = -10;
  }
  draw() {
    ctx.fillStyle = `rgba(${C_WHITE[0]},${C_WHITE[1]},${C_WHITE[2]},${this.alpha})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size*DPR, 0, Math.PI*2);
    ctx.fill();
  }
}
const dusts = Array.from({length: 500}, () => new StarDust());

/* ============ 圆环 HUD ============ */
class HUDRing {
  constructor(radius, speed, segments, color, glowColor, hasScanner) {
    this.radius = radius;
    this.speed = speed;
    this.angle = 0;
    this.segments = segments;
    this.color = color;
    this.glowColor = glowColor;
    this.hasScanner = hasScanner;
    this.scannerPos = 0;
    this.scannerAlpha = 0;
    this.dots = [];
    const dotCount = Math.floor(radius / 12);
    for (let i=0; i<dotCount; i++) {
      this.dots.push({ angle: rand(0, Math.PI*2), size: rand(0.5, 1.8), alpha: rand(0.1, 0.4), pulseSpeed: rand(0.02, 0.06) });
    }
  }
  update(t) {
    this.angle += this.speed;
    this.scannerPos += this.speed * 2.5;
    if (this.scannerPos > Math.PI*2) this.scannerPos -= Math.PI*2;
    this.scannerAlpha = 0.6 + Math.sin(t*0.003)*0.3;
  }
  draw(t) {
    const r = this.radius * DPR;
    for (const seg of this.segments) {
      const start = seg.start + this.angle;
      const end = seg.end + this.angle;
      ctx.beginPath();
      ctx.arc(cx, cy, r, start, end);
      ctx.strokeStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${seg.alpha || 0.25})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      if (seg.glow) {
        const ex = cx + Math.cos(end)*r;
        const ey = cy + Math.sin(end)*r;
        ctx.beginPath();
        ctx.arc(ex, ey, 3, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${this.glowColor[0]},${this.glowColor[1]},${this.glowColor[2]},${this.scannerAlpha})`;
        ctx.fill();
      }
    }
    for (const dot of this.dots) {
      const a = dot.angle + this.angle;
      const x = cx + Math.cos(a)*r;
      const y = cy + Math.sin(a)*r;
      const alpha = dot.alpha + Math.sin(t*dot.pulseSpeed)*0.15;
      ctx.fillStyle = `rgba(${this.color[0]},${this.color[1]},${this.color[2]},${alpha})`;
      ctx.beginPath();
      ctx.arc(x, y, dot.size, 0, Math.PI*2);
      ctx.fill();
    }
    if (this.hasScanner) {
      const sx = cx + Math.cos(this.scannerPos)*r;
      const sy = cy + Math.sin(this.scannerPos)*r;
      ctx.beginPath();
      ctx.arc(sx, sy, 4, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${this.glowColor[0]},${this.glowColor[1]},${this.glowColor[2]},${this.scannerAlpha})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(sx, sy, 14, 0, Math.PI*2);
      const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, 14);
      grad.addColorStop(0, `rgba(${this.glowColor[0]},${this.glowColor[1]},${this.glowColor[2]},${this.scannerAlpha*0.5})`);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fill();
    }
  }
}

const rings = [
  new HUDRing(Math.min(W, H) * 0.38, 0.001,
    [{start:0, end:Math.PI*0.6, alpha:0.15, glow:true}, {start:Math.PI*0.7, end:Math.PI*1.3, alpha:0.1}, {start:Math.PI*1.5, end:Math.PI*2.1, alpha:0.2, glow:true}, {start:Math.PI*2.2, end:Math.PI*2.5, alpha:0.08}],
    C_BLUE, C_BLUE_BRIGHT, true),
  new HUDRing(Math.min(W, H) * 0.30, -0.0015,
    [{start:0, end:Math.PI*0.8, alpha:0.25, glow:true}, {start:Math.PI*1.0, end:Math.PI*1.6, alpha:0.15}, {start:Math.PI*1.8, end:Math.PI*2.5, alpha:0.2, glow:true}],
    C_GOLD, C_GOLD_BRIGHT, true),
  new HUDRing(Math.min(W, H) * 0.22, 0.002,
    [{start:0, end:Math.PI*0.4, alpha:0.2}, {start:Math.PI*0.5, end:Math.PI*1.1, alpha:0.15, glow:true}, {start:Math.PI*1.3, end:Math.PI*2.0, alpha:0.2}, {start:Math.PI*2.1, end:Math.PI*2.3, alpha:0.1, glow:true}],
    C_GOLD, C_GOLD_BRIGHT, false),
  new HUDRing(Math.min(W, H) * 0.15, -0.003,
    [{start:0, end:Math.PI*2, alpha:0.08}],
    C_WHITE, C_WHITE, false)
];

/* ============ 中心 R Logo ============ */
class LogoR {
  constructor() {
    this.lines = [
      {x1:0, y1:-50, x2:0, y2:50, delay:1200, speed:700},
      {x1:0, y1:-50, x2:25, y2:-65, delay:1400, speed:500},
      {x1:25, y1:-65, x2:50, y2:-50, delay:1500, speed:500},
      {x1:0, y1:-15, x2:35, y2:-15, delay:1700, speed:500},
      {x1:35, y1:-15, x2:50, y2:5, delay:1800, speed:500},
      {x1:35, y1:-15, x2:35, y2:50, delay:2000, speed:700},
      {x1:35, y1:50, x2:55, y2:65, delay:2200, speed:500},
      {x1:10, y1:-50, x2:10, y2:-15, delay:1600, speed:700},
      {x1:25, y1:-50, x2:25, y2:-15, delay:1700, speed:700},
      {x1:10, y1:-35, x2:35, y2:-35, delay:1900, speed:500},
      {x1:0, y1:50, x2:35, y2:50, delay:2100, speed:500}
    ];
    for (const line of this.lines) line.progress = 0;
    this.opacity = 0;
  }
  update(t) {
    this.opacity = t < 1000 ? 0 : Math.min(1, (t-1000)/600);
    for (const line of this.lines) {
      const target = Math.min(1, (t - line.delay) / line.speed);
      line.progress = Math.max(0, target);
    }
  }
  draw() {
    if (this.opacity <= 0) return;
    const scale = Math.min(W, H) * 0.0012;
    ctx.lineWidth = 1.5;
    for (const line of this.lines) {
      if (line.progress <= 0) continue;
      const dx = line.x2 - line.x1;
      const dy = line.y2 - line.y1;
      ctx.beginPath();
      ctx.moveTo(cx + line.x1*scale*DPR, cy + line.y1*scale*DPR);
      ctx.lineTo(cx + (line.x1 + dx*line.progress)*scale*DPR, cy + (line.y1 + dy*line.progress)*scale*DPR);
      ctx.strokeStyle = `rgba(${C_GOLD_BRIGHT[0]},${C_GOLD_BRIGHT[1]},${C_GOLD_BRIGHT[2]},${this.opacity * 0.8})`;
      ctx.stroke();
      if (line.progress > 0.9) {
        const ex = cx + line.x2*scale*DPR;
        const ey = cy + line.y2*scale*DPR;
        ctx.beginPath();
        ctx.arc(ex, ey, 2, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${C_GOLD_BRIGHT[0]},${C_GOLD_BRIGHT[1]},${C_GOLD_BRIGHT[2]},${(line.progress-0.9)*10 * this.opacity})`;
        ctx.fill();
      }
    }
  }
}
const logoR = new LogoR();

/* ============ 文字 ROM-AI ============ */
class BrandText {
  constructor() {
    this.chars = [
      {char:'R', x:-130, glow:0}, {char:'O', x:-70, glow:0}, {char:'M', x:-10, glow:0},
      {char:'-', x:55, glow:0}, {char:'A', x:85, glow:0}, {char:'I', x:145, glow:0}
    ];
    this.revealProgress = 0;
    this.scanX = -300;
    this.flareAlpha = 0;
  }
  update(t) {
    this.revealProgress = t < 2200 ? 0 : Math.min(1, (t-2200)/1200);
    this.scanX = lerp(-300, 300, this.revealProgress);
    this.flareAlpha = t < 3200 ? 0 : Math.max(0, 1 - (t-3200)/800);
  }
  draw() {
    if (this.revealProgress <= 0) return;
    const scale = Math.min(W, H) * 0.001;
    const baseY = cy + 100 * DPR;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const c of this.chars) {
      const cxPos = cx + c.x * scale * DPR;
      const charWidth = 55 * scale * DPR;
      const scanReveal = this.scanX > (c.x + 300)/600 * 600 - 300;
      const fontSize = 72 * scale * DPR;
      ctx.font = `200 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      if (scanReveal) {
        ctx.fillStyle = c.char === 'A' || c.char === 'I' 
          ? `rgba(${C_GOLD[0]},${C_GOLD[1]},${C_GOLD[2]},${this.revealProgress})`
          : `rgba(${C_WHITE[0]},${C_WHITE[1]},${C_WHITE[2]},${this.revealProgress})`;
        ctx.fillText(c.char, cxPos, baseY);
        ctx.shadowColor = `rgba(${C_GOLD[0]},${C_GOLD[1]},${C_GOLD[2]},0.4)`;
        ctx.shadowBlur = 20;
        ctx.fillText(c.char, cxPos, baseY);
        ctx.shadowBlur = 0;
      } else {
        ctx.strokeStyle = `rgba(${C_GOLD[0]},${C_GOLD[1]},${C_GOLD[2]},${this.revealProgress * 0.3})`;
        ctx.lineWidth = 0.5;
        ctx.strokeText(c.char, cxPos, baseY);
      }
    }
    if (this.revealProgress > 0 && this.revealProgress < 1) {
      const scanScreenX = cx + this.scanX * scale * DPR;
      ctx.beginPath();
      ctx.moveTo(scanScreenX, baseY - 60 * scale * DPR);
      ctx.lineTo(scanScreenX, baseY + 60 * scale * DPR);
      ctx.strokeStyle = `rgba(${C_GOLD_BRIGHT[0]},${C_GOLD_BRIGHT[1]},${C_GOLD_BRIGHT[2]},0.8)`;
      ctx.lineWidth = 2;
      ctx.shadowColor = `rgba(${C_GOLD_BRIGHT[0]},${C_GOLD_BRIGHT[1]},${C_GOLD_BRIGHT[2]},0.5)`;
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.shadowBlur = 0;
      const flareGrad = ctx.createLinearGradient(scanScreenX, baseY - 60*scale*DPR, scanScreenX, baseY + 60*scale*DPR);
      flareGrad.addColorStop(0, 'rgba(255,255,255,0)');
      flareGrad.addColorStop(0.5, `rgba(${C_GOLD_BRIGHT[0]},${C_GOLD_BRIGHT[1]},${C_GOLD_BRIGHT[2]},0.15)`);
      flareGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = flareGrad;
      ctx.fillRect(scanScreenX - 40*scale*DPR, baseY - 60*scale*DPR, 80*scale*DPR, 120*scale*DPR);
    }
    if (this.flareAlpha > 0) {
      const flareGrad = ctx.createLinearGradient(cx - 300*scale*DPR, baseY, cx + 300*scale*DPR, baseY);
      flareGrad.addColorStop(0, 'rgba(255,255,255,0)');
      flareGrad.addColorStop(0.3, `rgba(${C_GOLD_BRIGHT[0]},${C_GOLD_BRIGHT[1]},${C_GOLD_BRIGHT[2]},${this.flareAlpha*0.3})`);
      flareGrad.addColorStop(0.5, `rgba(255,255,255,${this.flareAlpha*0.6})`);
      flareGrad.addColorStop(0.7, `rgba(${C_GOLD_BRIGHT[0]},${C_GOLD_BRIGHT[1]},${C_GOLD_BRIGHT[2]},${this.flareAlpha*0.3})`);
      flareGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = flareGrad;
      ctx.fillRect(cx - 300*scale*DPR, baseY - 15*scale*DPR, 600*scale*DPR, 30*scale*DPR);
    }
    ctx.restore();
  }
}
const brandText = new BrandText();

/* ============ 副标题 ============ */
class Subtitle {
  update(t) { this.alpha = t < 3200 ? 0 : Math.min(1, (t-3200)/600); }
  draw() {
    if (this.alpha <= 0) return;
    const scale = Math.min(W, H) * 0.001;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `400 ${12*scale*DPR}px monospace`;
    ctx.fillStyle = `rgba(${C_GOLD[0]},${C_GOLD[1]},${C_GOLD[2]},${this.alpha * 0.5})`;
    ctx.fillText('DESIGN INTELLIGENCE. BUILT DIFFERENT.', cx, cy + 160*scale*DPR);
    ctx.restore();
  }
}
const subtitle = new Subtitle();

/* ============ 进度条 ============ */
class ProgressBar {
  update(t) {
    this.startTime = 3500;
    this.duration = 3000;
    if (t < this.startTime) { this.progress = 0; this.alpha = 0; }
    else {
      this.alpha = Math.min(1, (t-this.startTime)/400);
      const raw = Math.min(1, (t-this.startTime)/this.duration);
      this.progress = 1 - Math.pow(1-raw, 3);
    }
    this.percent = Math.floor(this.progress * 100);
  }
  draw() {
    if (this.alpha <= 0) return;
    const scale = Math.min(W, H) * 0.001;
    const barY = cy + 220 * scale * DPR;
    const barW = 200 * scale * DPR;
    const barH = 1.5 * scale * DPR;
    ctx.fillStyle = `rgba(255,255,255,0.04)`;
    ctx.fillRect(cx - barW/2, barY, barW, barH);
    const fillW = barW * this.progress;
    if (fillW > 0) {
      const grad = ctx.createLinearGradient(cx - barW/2, barY, cx - barW/2 + fillW, barY);
      grad.addColorStop(0, `rgba(${C_GOLD[0]},${C_GOLD[1]},${C_GOLD[2]},0.3)`);
      grad.addColorStop(0.5, `rgba(${C_GOLD[0]},${C_GOLD[1]},${C_GOLD[2]},0.8)`);
      grad.addColorStop(1, `rgba(${C_GOLD_BRIGHT[0]},${C_GOLD_BRIGHT[1]},${C_GOLD_BRIGHT[2]},1)`);
      ctx.fillStyle = grad;
      ctx.fillRect(cx - barW/2, barY, fillW, barH);
      ctx.beginPath();
      ctx.arc(cx - barW/2 + fillW, barY + barH/2, 3*scale*DPR, 0, Math.PI*2);
      ctx.fillStyle = `rgba(${C_GOLD_BRIGHT[0]},${C_GOLD_BRIGHT[1]},${C_GOLD_BRIGHT[2]},0.8)`;
      ctx.fill();
      ctx.shadowColor = `rgba(${C_GOLD_BRIGHT[0]},${C_GOLD_BRIGHT[1]},${C_GOLD_BRIGHT[2]},0.5)`;
      ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = `200 ${28*scale*DPR}px -apple-system, sans-serif`;
    ctx.fillStyle = `rgba(${C_GOLD[0]},${C_GOLD[1]},${C_GOLD[2]},${this.alpha})`;
    ctx.fillText(this.percent + '%', cx, barY + 40*scale*DPR);
    ctx.font = `400 ${9*scale*DPR}px monospace`;
    let statusText = 'INITIALIZING';
    if (this.progress > 0.3) statusText = 'LOADING MODULES';
    if (this.progress > 0.6) statusText = 'SYNCING';
    if (this.progress > 0.9) statusText = 'FINALIZING';
    ctx.fillStyle = `rgba(255,255,255,${this.alpha*0.3})`;
    ctx.fillText(statusText, cx, barY - 15*scale*DPR);
    ctx.restore();
  }
}
const progressBar = new ProgressBar();

/* ============ 角落文字 ============ */
class CornerText {
  update(t) { this.alpha = t < 800 ? 0 : Math.min(0.5, (t-800)/1200); }
  draw() {
    if (this.alpha <= 0) return;
    const scale = Math.min(W, H) * 0.001;
    ctx.save();
    ctx.font = `400 ${8*scale*DPR}px monospace`;
    ctx.fillStyle = `rgba(255,255,255,${this.alpha})`;
    ctx.textAlign = 'left';
    ctx.fillText('+  ARCHITECTURE  x  INTELLIGENCE  x  INNOVATION', 40*DPR, 40*DPR);
    ctx.textAlign = 'right';
    ctx.fillText('SYSTEM READY  +', W - 40*DPR, 40*DPR);
    ctx.fillText('ROM-AI ENGINE v1.0.0  ———  +', W - 40*DPR, 55*DPR);
    ctx.textAlign = 'left';
    ctx.fillText('+', 40*DPR, H - 40*DPR);
    ctx.fillText('© 2024 ROM-AI. ALL RIGHTS RESERVED.', 40*DPR, H - 25*DPR);
    ctx.textAlign = 'right';
    ctx.fillText('+', W - 40*DPR, H - 40*DPR);
    ctx.fillText('BUILDING BETTER TOMORROW.', W - 40*DPR, H - 25*DPR);
    ctx.restore();
  }
}
const cornerText = new CornerText();

/* ============ 光效 ============ */
class LightEffects {
  update(t) { this.t = t; }
  draw() {
    const scale = Math.min(W, H) * 0.001;
    const glowGrad = ctx.createRadialGradient(cx, cy + 180*scale*DPR, 0, cx, cy + 180*scale*DPR, 200*scale*DPR);
    glowGrad.addColorStop(0, `rgba(${C_GOLD[0]},${C_GOLD[1]},${C_GOLD[2]},0.06)`);
    glowGrad.addColorStop(0.5, `rgba(${C_GOLD[0]},${C_GOLD[1]},${C_GOLD[2]},0.02)`);
    glowGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.fillRect(cx - 200*scale*DPR, cy, 400*scale*DPR, 200*scale*DPR);
    const topGlow = ctx.createRadialGradient(cx, cy - 150*scale*DPR, 0, cx, cy - 150*scale*DPR, 150*scale*DPR);
    topGlow.addColorStop(0, `rgba(${C_BLUE[0]},${C_BLUE[1]},${C_BLUE[2]},0.04)`);
    topGlow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = topGlow;
    ctx.fillRect(cx - 150*scale*DPR, cy - 300*scale*DPR, 300*scale*DPR, 300*scale*DPR);
  }
}
const lightEffects = new LightEffects();

/* ============ 主循环 ============ */
let startTime = null;
function animate(ts) {
  if (!startTime) startTime = ts;
  const t = ts - startTime;
  
  ctx.fillStyle = 'rgba(6,6,8,0.08)';
  ctx.fillRect(0, 0, W, H);
  
  const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H));
  bgGrad.addColorStop(0, 'rgba(18,20,26,0.3)');
  bgGrad.addColorStop(0.5, 'rgba(10,11,14,0.1)');
  bgGrad.addColorStop(1, 'rgba(6,6,8,0)');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  
  lightEffects.update(t); lightEffects.draw();
  for (const d of dusts) { d.update(t); d.draw(); }
  for (const ring of rings) { ring.update(t); ring.draw(t); }
  logoR.update(t); logoR.draw();
  brandText.update(t); brandText.draw();
  subtitle.update(t); subtitle.draw();
  progressBar.update(t); progressBar.draw();
  cornerText.update(t); cornerText.draw();
  
  if (t > 7000) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = `400 ${11*Math.min(W,H)*0.001*DPR}px monospace`;
    const readyAlpha = Math.min(0.7, (t-7000)/500);
    ctx.fillStyle = `rgba(${C_GOLD[0]},${C_GOLD[1]},${C_GOLD[2]},${readyAlpha})`;
    ctx.fillText('SYSTEM READY', cx, cy + 300*Math.min(W,H)*0.001*DPR);
    ctx.restore();
  }
  
  if (t > 8500) {
    const exitAlpha = Math.min(1, (t-8500)/800);
    ctx.fillStyle = `rgba(6,6,8,${exitAlpha})`;
    ctx.fillRect(0, 0, W, H);
  }
  
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
