name: Deploy ROM-AI and Prompt Daily to GitHub Pages

on:
  push:
    branches:
      - polish/three-states
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install ROM-AI dependencies
        working-directory: frontend
        run: npm ci

      - name: Build ROM-AI
        working-directory: frontend
        run: npm run build

      - name: Unpack Prompt Daily source
        run: |
          rm -rf .prompt-lab-src
          mkdir -p .prompt-lab-src
          cat prompt-lab/source.part*.b64 | base64 --decode | tar -xz -C .prompt-lab-src
          grep -RIl 'white/8' .prompt-lab-src/src | xargs -r sed -i 's#white/8#white/[0.08]#g'

      - name: Install Prompt Daily dependencies
        working-directory: .prompt-lab-src
        run: npm install --no-audit --no-fund

      - name: Build Prompt Daily
        working-directory: .prompt-lab-src
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p frontend/dist/prompt-lab
          cp -R .prompt-lab-src/dist/. frontend/dist/prompt-lab/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
